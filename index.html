.cvw{position:relative}

.btn,.chip,.tab{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}

.on{background:var(--on);border-color:var(--rose)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px}
.tab{white-space:nowrap;font-weight:700}

.ch{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;font-size:14px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}

.th canvas{width:100%;height:100%;border-radius:13px;display:block}

input[type=range]{width:100%;accent-color:#f08aae}

ul{padding-inline-start:20px;margin:8px 0 0;font-size:14px;line-height:1.7}

.tg{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}

 const tips=[];
 if(chal)tips.push(th<.5?`الإطلالة لا تناسب «${T.n}» بعد، جرّبي قطعًا بطابع ${Object.keys(T.w).map(k=>TAGN[k]).join(' أو ')}.`:`إطلالة مناسبة جدًا لـ «${T.n}»! 🎉`);
 else if(h<.6)tips.push('اختاري قطعًا من نفس الستايل لإطلالة أكثر تناغمًا.');
 tips.push(cs<.7?'جرّبي ألوانًا متقاربة أو محايدة (كريمي، أبيض) لتناسق أجمل.':'تناسق الألوان لطيف ومريح للعين 💗');
 if(mk<2)tips.push('أضيفي لمسة مكياج: أحمر خدود أو أحمر شفاه لإشراقة أكبر.');else if(mk>4)tips.push('المكياج كثير قليلًا، خففي طبقة لإطلالة أنقى.');
 if(ac.length<2)tips.push('إكسسوار أو اثنان سيكملان الإطلالة.');else if(ac.length>4)tips.push('قللي الإكسسوارات قليلًا؛ البساطة أنيقة!');
 if(cr>.85)tips.push('لمستك الإبداعية واضحة ✨');
 return{score,stars,title,parts:[a,cs,bal,cr],tips:tips.slice(0,3)}}

/* ============ الصوت (Web Audio) ============ */
function snd(t){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;
 if(t=='shutter'){const b=AC.createBuffer(1,AC.sampleRate*.15,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const o=AC.createBufferSource(),g=AC.createGain();o.buffer=b;g.gain.value=.3;o.connect(g).connect(AC.destination);o.start();return}
 (t=='spark'?[1047,1319,1568]:[720]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),a=n+i*.07;o.frequency.value=f;g.gain.setValueAtTime(.001,a);g.gain.exponentialRampToValueAtTime(.12,a+.01);g.gain.exponentialRampToValueAtTime(.001,a+.18);o.connect(g).connect(AC.destination);o.start(a);o.stop(a+.2)})}catch(e){}}

/* ============ الواجهة ============ */
function paint(){const c=$('#cv'),x=c.getContext('2d');x.setTransform(2,0,0,2,0,0);draw(x,s);const r=rate(s);
 $('#live').textContent='★'.repeat(r.stars)+' '+r.score+'/100 · '+r.title;
 if($('#rate').classList.contains('show'))showRate(r)}
function showRate(r=rate(s)){const lb=[chal?'مطابقة التحدّي':'تناغم الستايل','تنسيق الألوان','توازن المكياج والإكسسوار','الإبداع'];
 $('#rate').innerHTML=`<div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div><div class="big">${r.score}<small style="font-size:16px"> / 100</small></div><div class="badge">${r.title}</div>`+
 r.parts.map((p,i)=>`<div class="m"><span>${lb[i]}</span><i><b style="width:${Math.round(p*100)}%"></b></i><span>${Math.round(p*100)}</span></div>`).join('')+`<ul>${r.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`;
 $('#rate').classList.add('show')}
function chalUI(){const c=$('#chal');c.classList.toggle('show',chal);if(chal)c.innerHTML=`<b>التحدّي: ${THEMES[ti].n}</b><br><small>ألبسي الشخصية لتناسب المناسبة، والخلفية المناسبة تمنحك نقاطًا إضافية.</small><br><button class="btn" id="nc" style="margin-top:6px">🎯 تحدٍّ جديد</button>`}
// صور مصغّرة: نرسم الخيار نفسه على الشخصية ونقصّ المنطقة المناسبة
const CR={head:[100,70,200],hair:[70,40,260],low:[70,330,260],body:[70,236,260],acc:[70,290,240],neck:[110,200,180],bg:[0,100,400]};
const CK={skin:'head',eyes:'head',eyeStyle:'head',brow:'head',hair:'hair',hairC:'hair',blush:'head',shadow:'head',liner:'head',lip:'head',spark:'head',glasses:'head',earrings:'head',hat:'hair',dress:'body',top:'body',outer:'body',bottom:'low',necklace:'neck',bag:'acc',bracelet:'acc',prop:'acc',bg:'bg'};
function thumb(c){const k=c.dataset.k,i=+c.dataset.i,[cx,cy,w]=CR[CK[k]],sc=c.width/w,x=c.getContext('2d'),t={...s,[k]:i};
 if(k=='dress'||k=='top'||k=='bottom')t.outer=0;if(k=='top'||k=='bottom')t.dress=0;
 x.setTransform(sc,0,0,sc,-cx*sc,-cy*sc);draw(x,t,{nb:k!='bg',bgOnly:k=='bg'})}
function panel(){$('#tabs').innerHTML=TABS.map((t,i)=>`<button class="tab${i==tab?' on':''}" role="tab" data-t="${i}">${t.n}</button>`).join('');
 $('#opts').innerHTML=TABS[tab].r.map(r=>{if(r.sl)return s.blush?`<div class="row"><h4>${r.t}</h4><input type="range" id="sl" min="0" max="100" value="${s.bi}"></div>`:'';
  return`<div class="row"><h4>${r.t}</h4><div class="${r.sw?'ch':'tg'}">`+r.o.map((x,i)=>{const on=s[r.k]==i?' on':'';
   if(r.sw)return`<button class="sw${on}" data-k="${r.k}" data-i="${i}" title="${x[0]}" aria-label="${x[0]}" style="background:${x[1]||'#fff'}">${x[1]?'':'✕'}</button>`;
   return`<button class="th${on}" data-k="${r.k}" data-i="${i}" title="${x[0]}" aria-label="${x[0]}">${x[0]=='بدون'?'🚫':`<canvas width="128" height="128" data-k="${r.k}" data-i="${i}"></canvas>`}</button>`}).join('')+'</div></div>'}).join('');
 $('#opts').querySelectorAll('canvas').forEach(thumb)}
function sync(snds){panel();paint();const c=$('#cv');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');if(snds)snd(snds)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=+b.dataset.t;panel();snd('click')}
 else if(b.dataset.k){s[b.dataset.k]=+b.dataset.i;sync(['spark','spark'].includes(b.dataset.k)||b.dataset.k=='spark'?'spark':'click')}
 else if(b.id=='nc'){ti=(ti+1)%THEMES.length;chalUI();paint();snd('spark')}});
document.addEventListener('input',e=>{if(e.target.id=='sl'){s.bi=+e.target.value;paint()}});
$('#chk').onchange=e=>{chal=e.target.checked;chalUI();paint();snd('spark')};
$('#rb').onclick=()=>{const c=$('#rate');if(c.classList.contains('show')&&c.dataset.o){c.classList.remove('show');c.dataset.o='';return}c.dataset.o=1;showRate();snd('spark')};
$('#rst').onclick=()=>{s=D();sync('click')};
const RN={skin:5,eyes:5,eyeStyle:3,brow:3,hair:8,hairC:7,blush:5,shadow:6,liner:2,lip:6,spark:2,dress:8,top:7,bottom:7,outer:6,glasses:5,earrings:5,necklace:4,bag:3,hat:7,bracelet:3,prop:7,bg:7};
$('#rnd').onclick=()=>{Object.keys(RN).forEach(k=>{s[k]=Math.floor(Math.random()*RN[k]);if(['dress','outer','glasses','earrings','necklace','bag','hat','bracelet','prop'].includes(k)&&Math.random()<.5)s[k]=0;if(['top','bottom'].includes(k)&&!s[k])s[k]=1});s.bi=20+Math.floor(Math.random()*70);sync('spark')};
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊';snd('click')};

/* ============ ستوديو التصوير والتحميل ============ */
const po=()=>({frame:$('#fr').checked,badge:$('#bd').checked,tag:$('#tg').checked,r:rate(s)});
function pv(){const x=$('#pv').getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,400,600);draw(x,s,po())}
$('#shot').onclick=()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');snd('shutter');setTimeout(()=>{$('#modal').classList.add('show');pv()},380)};
['fr','bd','tg'].forEach(i=>$('#'+i).onchange=pv);
$('#ed').onclick=()=>$('#modal').classList.remove('show');
$('#nw').onclick=()=>{$('#modal').classList.remove('show');s=D();ti=Math.floor(Math.random()*THEMES.length);chalUI();sync('spark')};
// تصدير PNG بدقة ١٢٠٠×١٨٠٠ (رسم كامل بالكانفس، بلا صور خارجية فلا مشاكل CORS)
$('#dl').onclick=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1800;const x=c.getContext('2d');x.setTransform(3,0,0,3,0,0);draw(x,s,po());
 const go=u=>{const a=document.createElement('a');a.href=u;a.download='my-look.png';document.body.appendChild(a);a.click();a.remove()};
 if(c.toBlob)c.toBlob(b=>{const u=URL.createObjectURL(b);go(u);setTimeout(()=>URL.revokeObjectURL(u),3000)},'image/png');else go(c.toDataURL('image/png'));snd('spark')};

setInterval(()=>{BL_=true;const q=()=>{const x=$('#cv').getContext('2d');x.setTransform(2,0,0,2,0,0);draw(x,s)};q();setTimeout(()=>{BL_=false;q()},140)},3600);
sync();document.fonts&&document.fonts.ready.then(paint);
</script></body></html>
